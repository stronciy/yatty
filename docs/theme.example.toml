# ~/.config/yatty/themes/<name>.toml
# Файл темы использует те же ключи, что и секция [colors] в config.toml.
# Все ключи необязательны: непереданные берутся из встроенной темы.

foreground = "#D0D7E5"
background = "#0D1117"
cursor = "#FF9E64"

# 16 цветов: 0–7 обычные, 8–15 яркие.
palette = [
    "#15161A", "#F7768E", "#9ECE6A", "#E0AF68",
    "#7AA2F7", "#BB9AF7", "#7DCFFF", "#A9B1D6",
    "#414868", "#F7768E", "#9ECE6A", "#E0AF68",
    "#7AA2F7", "#BB9AF7", "#7DCFFF", "#C0CAF5",
]
